  <circle cx="380" cy="60" r="26" fill="#f5d76e" stroke="#c9a227" stroke-width="2"/>
  <!-- mountains -->
  <polygon points="10,230 130,110 220,190 290,120 470,230" fill="#7a9a5c" stroke="#4f6b3a" stroke-width="2"/>
  <polygon points="10,230 90,150 170,230" fill="#5c7a46" stroke="#3f5730" stroke-width="2"/>
  <!-- ground -->
