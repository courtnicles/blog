<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240">
  <rect width="480" height="240" fill="#E8D5D7"/>
  <rect x="4" y="4" width="472" height="232" fill="none" stroke="#808080" stroke-width="2"/>
  <rect x="10" y="10" width="460" height="220" fill="#ffffff" stroke="#3D2B5F" stroke-width="1"/>

  <!-- sky -->
  <rect x="10" y="10" width="460" height="220" fill="#bcd7e6"/>
